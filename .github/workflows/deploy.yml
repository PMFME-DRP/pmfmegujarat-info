name: Deploy PMFME Gujarat to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site
          curl -L "https://raw.githubusercontent.com/PMFME-DRP/PMFME-DRP-WEBSITE/main/index.html" -o _site/index.html

          # Copy website assets, including homepage videos.
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/PMFME-DRP/PMFME-DRP-WEBSITE.git original-site
          cd original-site
          git sparse-checkout set assets
          git checkout
          cd ..
          cp -R original-site/assets _site/assets
          rm -rf original-site

          # Correct old domain references.
          sed -i 's#https://www\\.pmfmegujarat\\.infofofofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\\.pmfmegujarat\\.infofofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\\.pmfmegujarat\\.infofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\\.pmfmegujarat\\.in#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://pmfmegujarat\\.in#https://pmfmegujarat.info#g' _site/index.html

          # Remove the old dashboard section completely.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- PMFME_OFFICIAL_DASHBOARD_HOME -->'
          start = s.find(marker)
          if start != -1:
              end = s.find('</main>', start)
              if end != -1:
                  s = s[:start] + s[end:]

          # Add a dedicated professional collaboration / Connect to Shankar section.
          connect = r'''
          <section id="connect-shankar" class="connect-shankar-section">
            <style>
              .connect-shankar-section{padding:72px 0;background:linear-gradient(180deg,#f7fbfd 0%,#edf7fa 100%);border-top:1px solid #d8e9f0}
              .connect-shankar-wrap{width:min(1160px,92%);margin:auto}
              .connect-shankar-head{text-align:center;max-width:820px;margin:0 auto 30px}
              .connect-shankar-head .eyebrow{color:#1d6f9f;font-size:12px;letter-spacing:2px;font-weight:900}
              .connect-shankar-head h2{font-size:clamp(31px,4vw,44px);line-height:1.12;color:#123f63;margin:8px 0 12px}
              .connect-shankar-head p{color:#5d7485;font-size:15px;margin:0 auto;max-width:760px}
              .connect-shankar-badge{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #cfe4ed;border-radius:999px;padding:7px 12px;color:#2b756e;font-size:11px;font-weight:900;margin-bottom:10px}
              .connect-shankar-badge i{width:8px;height:8px;border-radius:50%;background:#2b9b93;display:inline-block}
              .connect-shankar-grid{display:grid;grid-template-columns:1fr 1.35fr;gap:22px;align-items:start}
              .connect-shankar-info{background:linear-gradient(135deg,#123f63,#1d6f9f);color:#fff;border-radius:24px;padding:30px;box-shadow:0 15px 40px rgba(18,63,99,.16)}
              .connect-shankar-info h3{font-size:25px;margin:0 0 10px}.connect-shankar-info>p{color:#e9f6fa;font-size:14px;line-height:1.55;margin-bottom:20px}
              .connect-shankar-option{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid rgba(255,255,255,.18)}
              .connect-shankar-option:first-of-type{border-top:0}.connect-shankar-option .ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:19px}
              .connect-shankar-option b{display:block;font-size:14px;margin-bottom:2px}.connect-shankar-option span{display:block;color:#d8edf2;font-size:12px;line-height:1.35}
              .connect-shankar-direct{margin-top:18px;display:flex;gap:9px;flex-wrap:wrap}.connect-shankar-direct .btn{min-height:46px}
              .connect-shankar-form{background:#fff;border:1px solid #d4e5ec;border-radius:24px;padding:27px;box-shadow:0 12px 34px rgba(18,63,99,.08)}
              .connect-shankar-form h3{color:#123f63;font-size:22px;margin:0 0 4px}.connect-shankar-form .intro{color:#718593;font-size:12px;margin-bottom:19px}
              .connect-shankar-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.connect-shankar-field{margin-bottom:0}.connect-shankar-field.full{grid-column:1/-1}
              .connect-shankar-field label{display:block;font-size:12px;font-weight:900;color:#294b60;margin:0 0 6px}.connect-shankar-field input,.connect-shankar-field select,.connect-shankar-field textarea{width:100%;border:1px solid #cbdde5;border-radius:12px;padding:11px 12px;background:#fff;color:#18364a;outline-color:#1d6f9f;font-size:13px}
              .connect-shankar-field textarea{min-height:92px;resize:vertical}.connect-shankar-note{font-size:10px;color:#718593;margin-top:6px}
              .connect-shankar-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.connect-shankar-actions .btn{min-height:48px}.connect-shankar-whatsapp{background:#1d9c8f;color:#fff}
              .connect-shankar-success{display:none;margin-top:12px;padding:12px 14px;background:#edf9f5;border:1px solid #c6e8dd;border-radius:12px;color:#24695e;font-size:12px}
              .connect-shankar-success.show{display:block}
              .connect-shankar-bottom{margin-top:18px;text-align:center;color:#718593;font-size:11px}.connect-shankar-bottom b{color:#123f63}
              @media(max-width:850px){.connect-shankar-grid{grid-template-columns:1fr}.connect-shankar-info{padding:25px}}
              @media(max-width:600px){.connect-shankar-section{padding:52px 0}.connect-shankar-grid{gap:15px}.connect-shankar-form{padding:20px}.connect-shankar-form-grid{grid-template-columns:1fr}.connect-shankar-field.full{grid-column:auto}.connect-shankar-actions{display:grid;grid-template-columns:1fr}.connect-shankar-actions .btn{width:100%}.connect-shankar-info h3{font-size:22px}}
            </style>
            <div class="connect-shankar-wrap">
              <div class="connect-shankar-head">
                <div class="connect-shankar-badge"><i></i> PROFESSIONAL CONNECT</div>
                <div class="eyebrow">CONNECT TO SHANKAR</div>
                <h2>Are you a CA, consultant or professional working with food businesses?</h2>
                <p>If you want to discuss a PMFME case, collaborate on client support, refer an entrepreneur or work together on project preparation, send a structured request directly to DRP Shankar Pradhan.</p>
              </div>

              <div class="connect-shankar-grid">
                <div class="connect-shankar-info">
                  <h3>🤝 What can we discuss?</h3>
                  <p>Choose the area that matches your requirement. You can connect as a professional, consultant, applicant or referral partner.</p>

                  <div class="connect-shankar-option"><div class="ico">🧾</div><div><b>CA / Tax / Accounting Professional</b><span>Discuss client cases, business structure, documentation, financial information and PMFME-related coordination.</span></div></div>
                  <div class="connect-shankar-option"><div class="ico">📊</div><div><b>PMFME / Project Consultant</b><span>Collaborate on project planning, DPR, CMA, machinery planning, cost estimation and application preparation.</span></div></div>
                  <div class="connect-shankar-option"><div class="ico">🏦</div><div><b>Bank / Finance Professional</b><span>Discuss suitable cases, financing requirements and coordination related to eligible food-processing projects.</span></div></div>
                  <div class="connect-shankar-option"><div class="ico">🏭</div><div><b>Machinery / Technical Consultant</b><span>Coordinate on machinery quotations, capacity, project configuration and food-processing unit requirements.</span></div></div>
                  <div class="connect-shankar-option"><div class="ico">👤</div><div><b>Entrepreneur / Referral Partner</b><span>Refer a food-business applicant or discuss an existing PMFME application or project requirement.</span></div></div>

                  <div class="connect-shankar-direct">
                    <a class="btn orange" href="tel:+917041075170">📞 CALL SHANKAR</a>
                    <a class="btn white" href="https://wa.me/917041075170" target="_blank" rel="noopener">💬 WHATSAPP DIRECTLY</a>
                  </div>
                </div>

                <div class="connect-shankar-form">
                  <h3>Send a professional connection request</h3>
                  <p class="intro">Fill the short form. Your details will be converted into a WhatsApp message — no separate account or login required.</p>
                  <div class="connect-shankar-form-grid">
                    <div class="connect-shankar-field"><label for="csName">Your Name *</label><input id="csName" type="text" placeholder="Full name"></div>
                    <div class="connect-shankar-field"><label for="csMobile">Mobile Number *</label><input id="csMobile" type="tel" placeholder="10-digit mobile number"></div>
                    <div class="connect-shankar-field"><label for="csProfession">I am a *</label><select id="csProfession"><option value="">Select professional type</option><option>CA / Chartered Accountant</option><option>Tax / Accounting Professional</option><option>PMFME Consultant</option><option>Project / DPR / CMA Consultant</option><option>Bank / Finance Professional</option><option>Machinery / Technical Consultant</option><option>Food Business Entrepreneur</option><option>Referral / Industry Partner</option><option>Other Professional</option></select></div>
                    <div class="connect-shankar-field"><label for="csCity">City / District</label><input id="csCity" type="text" placeholder="e.g. Ahmedabad / Surat"></div>
                    <div class="connect-shankar-field full"><label for="csPurpose">What would you like to discuss? *</label><select id="csPurpose"><option value="">Select purpose</option><option>Collaborate on PMFME client cases</option><option>Refer a PMFME applicant / entrepreneur</option><option>Discuss DPR / Project Report / CMA</option><option>Discuss machinery / project cost</option><option>Discuss bank finance / loan coordination</option><option>Discuss an existing PMFME application</option><option>Professional partnership / collaboration</option><option>Training / awareness / event collaboration</option><option>Other</option></select></div>
                    <div class="connect-shankar-field full"><label for="csMessage">Briefly tell Shankar about your requirement</label><textarea id="csMessage" placeholder="Example: I am a CA in Ahmedabad and want to discuss PMFME cases for my food-business clients."></textarea></div>
                  </div>
                  <div class="connect-shankar-actions">
                    <button class="btn connect-shankar-whatsapp" id="csWhatsapp" type="button">💬 SEND CONNECTION REQUEST ON WHATSAPP</button>
                    <a class="btn green" href="tel:+917041075170">📞 CALL DRP SHANKAR</a>
                  </div>
                  <div class="connect-shankar-success" id="csSuccess" aria-live="polite">Your WhatsApp request is being prepared. Please review it and tap Send in WhatsApp.</div>
                  <div class="connect-shankar-note">Please do not send passwords, OTPs, bank PINs or other confidential credentials.</div>
                </div>
              </div>
              <div class="connect-shankar-bottom">For PMFME-related professional discussion and guidance. <b>Eligibility, sanction and final decisions remain subject to applicable scheme guidelines and the concerned authorities / financing institution.</b></div>
            </div>
            <script>
              (()=>{const b=document.getElementById('csWhatsapp');if(!b)return;const v=id=>document.getElementById(id)?.value.trim()||'';b.addEventListener('click',()=>{const name=v('csName'),mobile=v('csMobile'),profession=v('csProfession'),city=v('csCity'),purpose=v('csPurpose'),message=v('csMessage'),success=document.getElementById('csSuccess');if(!name||!mobile||!profession||!purpose){alert('Please fill Name, Mobile Number, Professional Type and Discussion Purpose.');return}const text=`Hello Shankar, I would like to connect regarding PMFME.\n\nName: ${name}\nMobile: ${mobile}\nProfessional role: ${profession}\nCity/District: ${city||'Not provided'}\nPurpose: ${purpose}\nRequirement: ${message||'I would like to discuss this in detail.'}\n\nSent from PMFME Gujarat website.`;success.classList.add('show');window.open('https://wa.me/917041075170?text='+encodeURIComponent(text),'_blank','noopener');});})();
            </script>
          </section>
          '''
          end = s.find('</main>')
          if end != -1 and 'id="connect-shankar"' not in s:
              s = s[:end] + connect + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://pmfmegujarat.info/sitemap.xml
          EOF

          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://pmfmegujarat.info/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>
          </urlset>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
