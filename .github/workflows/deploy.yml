name: Deploy PMFME Gujarat to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site
          curl -L "https://raw.githubusercontent.com/PMFME-DRP/PMFME-DRP-WEBSITE/main/index.html" -o _site/index.html

          # Copy all original assets, including homepage videos.
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/PMFME-DRP/PMFME-DRP-WEBSITE.git original-site
          cd original-site
          git sparse-checkout set assets
          git checkout
          cd ..
          cp -R original-site/assets _site/assets
          rm -rf original-site

          # Correct old domain references.
          sed -i 's#https://www\.pmfmegujarat\.infofofofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\.pmfmegujarat\.infofofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\.pmfmegujarat\.infofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\.pmfmegujarat\.in#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://pmfmegujarat\.in#https://pmfmegujarat.info#g' _site/index.html

          # Remove the stale local dashboard snapshot (last synchronized 23 Aug 2026)
          # and replace it with the current official Gujarat dashboard source.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<!-- PMFME_OFFICIAL_DASHBOARD_HOME -->')
          if start != -1:
              end = s.find('</section>', start)
              if end != -1:
                  end += len('</section>')
                  live = '''<!-- PMFME_OFFICIAL_DASHBOARD_HOME -->
          <section id="pmfme-official-dashboard" style="background:#f4fafd;padding:58px 0;border-top:1px solid #d8e9f0;border-bottom:1px solid #d8e9f0">
            <div style="width:min(1160px,92%);margin:auto">
              <div style="text-align:center;max-width:820px;margin:0 auto 24px">
                <span style="color:#1d6f9f;font-size:12px;letter-spacing:1.8px;font-weight:900">OFFICIAL GUJARAT DATA</span>
                <h2 style="font-size:clamp(30px,4vw,42px);line-height:1.12;color:#123f63;margin:7px 0 10px">PMFME Gujarat Dashboard</h2>
                <p style="color:#5d7485;font-size:14px">Current Gujarat dashboard from the Ministry of Food Processing Industries, Government of India.</p>
              </div>
              <div style="background:#fff;border:1px solid #d7e6ee;border-radius:18px;padding:10px;box-shadow:0 8px 22px rgba(18,63,99,.08)">
                <iframe src="https://pmfme.mofpi.gov.in/sitesubsite/#/state/gujarat" title="Official PMFME Gujarat Dashboard" style="width:100%;height:720px;border:0;border-radius:12px;background:#fff" loading="lazy"></iframe>
              </div>
              <div style="text-align:center;margin-top:14px">
                <a href="https://pmfme.mofpi.gov.in/sitesubsite/#/state/gujarat" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;background:#1d6f9f;color:#fff;border-radius:999px;padding:12px 19px;font-size:13px;font-weight:800;text-decoration:none">Open Current Official Gujarat Dashboard →</a>
              </div>
            </div>
          </section>'''
                  s = s[:start] + live + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://pmfmegujarat.info/sitemap.xml
          EOF

          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://pmfmegujarat.info/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>
          </urlset>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
