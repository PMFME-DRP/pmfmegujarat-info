name: Deploy PMFME Gujarat to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site
          curl -L "https://raw.githubusercontent.com/PMFME-DRP/PMFME-DRP-WEBSITE/main/index.html" -o _site/index.html

          # Copy all original assets, including homepage videos.
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/PMFME-DRP/PMFME-DRP-WEBSITE.git original-site
          cd original-site
          git sparse-checkout set assets
          git checkout
          cd ..
          cp -R original-site/assets _site/assets
          rm -rf original-site

          # Correct old domain references.
          sed -i 's#https://www\.pmfmegujarat\.infofofofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\.pmfmegujarat\.infofofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\.pmfmegujarat\.infofo#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://www\.pmfmegujarat\.in#https://pmfmegujarat.info#g' _site/index.html
          sed -i 's#https://pmfmegujarat\.in#https://pmfmegujarat.info#g' _site/index.html

          # Replace the entire old dashboard section safely.
          # The previous script stopped at the first nested </section>, which
          # left the HTML malformed and caused the dashboard layout to break.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<!-- PMFME_OFFICIAL_DASHBOARD_HOME -->')
          end_marker = '</section>\n\n</main>'
          if start != -1:
              end = s.find(end_marker, start)
              if end != -1:
                  end += len('</section>')
                  live = '''<!-- PMFME_OFFICIAL_DASHBOARD_HOME -->
          <section id="pmfme-official-dashboard" style="background:linear-gradient(180deg,#f4fafd 0%,#eef7fa 100%);padding:58px 0;border-top:1px solid #d8e9f0;border-bottom:1px solid #d8e9f0">
            <div style="width:min(1160px,92%);margin:auto">
              <div style="text-align:center;max-width:860px;margin:0 auto 28px">
                <span style="display:inline-block;color:#1d6f9f;font-size:12px;letter-spacing:1.8px;font-weight:900">OFFICIAL GOVERNMENT DATA</span>
                <h2 style="font-size:clamp(30px,4vw,42px);line-height:1.12;color:#123f63;margin:7px 0 10px">PMFME Gujarat Dashboard</h2>
                <p style="color:#5d7485;font-size:14px;margin:0">Live Gujarat dashboard from the Ministry of Food Processing Industries, Government of India.</p>
              </div>
              <div style="background:#fff;border:1px solid #d7e6ee;border-radius:22px;padding:10px;box-shadow:0 14px 38px rgba(18,63,99,.10);overflow:hidden">
                <div style="height:24px;display:flex;align-items:center;gap:8px;padding:0 8px;color:#5d7485;font-size:11px;font-weight:700">
                  <span style="width:8px;height:8px;border-radius:50%;background:#2b9b93;display:inline-block"></span>
                  LIVE OFFICIAL SOURCE
                </div>
                <iframe src="https://pmfme.mofpi.gov.in/sitesubsite/#/state/gujarat" title="Official PMFME Gujarat Dashboard" style="display:block;width:100%;height:760px;border:0;border-radius:14px;background:#fff" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
              </div>
              <div style="display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px">
                <a href="https://pmfme.mofpi.gov.in/sitesubsite/#/state/gujarat" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;background:#1d6f9f;color:#fff;border-radius:999px;padding:13px 20px;font-size:13px;font-weight:800;text-decoration:none">Open Official Gujarat Dashboard ↗</a>
                <span style="font-size:11px;color:#687f8d">If the government portal blocks embedded viewing, use the button above.</span>
              </div>
            </div>
          </section>'''
                  s = s[:start] + live + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          cat > _site/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://pmfmegujarat.info/sitemap.xml
          EOF

          cat > _site/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://pmfmegujarat.info/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>
          </urlset>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
